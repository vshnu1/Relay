services:
  - type: web
    name: relay-bayhacks
    runtime: node
    plan: starter
    # NODE_ENV=production below tells npm to skip devDependencies, and vite is
    # one of them, so a plain `npm ci` installs 101 packages and the build dies
    # on `vite: not found`. The build needs them; the running server does not.
    # The model is a Python program and this is the Node runtime, but that
    # runtime ships Python too, so it can run here. The verification at the end
    # is deliberate and unguarded: if the model's dependencies do not import,
    # the build fails and Render keeps the previous deploy serving, rather than
    # putting up a site whose model button errors.
    buildCommand: >-
      npm ci --include=dev && npm run build &&
      pip install -r requirements.txt &&
      python3 -c "import sklearn, numpy; print('model deps ok:', sklearn.__version__, numpy.__version__)"
    startCommand: npm start
    healthCheckPath: /
    disk:
      name: relay-demo-data
      mountPath: /var/data/relay
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      # Render defaults to Python 3.14, which has no scikit-learn 1.5 wheel, and
      # 1.5 is pinned because the priors in ml/artifacts were pickled with it.
      # Building it from source on a starter instance is not worth the minutes.
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: NODE_VERSION
        value: 24.11.1
      - key: DATA_DIR
        value: /var/data/relay
      # Required in production: the server refuses to boot without it, and on
      # its own it opens the clinician view. The two codes below give each
      # role its own door, which is what the sign-in screens expect; set both
      # in the dashboard, or the patient view cannot be signed into at all.
      - key: APP_ACCESS_TOKEN
        generateValue: true
      - key: CLINICIAN_ACCESS_CODE
        sync: false
      - key: PATIENT_ACCESS_CODE
        sync: false
      # On because the build installs the model's dependencies and proves they
      # import before the deploy is allowed to go live. PYTHON_BIN is left
      # unset so the server falls back to python3, which Render resolves to the
      # environment those dependencies were installed into.
      - key: RELAY_ML_ENABLED
        value: "true"
      # Encryption at rest, 164.312(a)(2)(iv). Render generates a value and
      # keeps it, so the disk stays readable across deploys. If this is ever
      # lost the files written under it are unrecoverable, which is the point of
      # it; with no key at all the server writes plaintext and the security page
      # says so rather than claiming otherwise.
      - key: RELAY_DATA_KEY
        generateValue: true
      # Accounts, 164.312(a)(2)(i) and (d), both required and not addressable.
      # With this on, the shared codes below stop being credentials and become
      # invitations: a code decides which role an account is created with and
      # reaches no record by itself. The sign-in screen offers a one-click demo
      # identity, distinct per browser and named in the audit trail, so nobody
      # judging this has to create an account to look around.
      - key: RELAY_REQUIRE_ACCOUNTS
        value: "true"
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_WORKFLOW_SLUG
        value: relay-workflow
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_AGENT_ID
        sync: false
      # This deployment is currently a synthetic-data demo. Keep clinician
      # speech summaries available; turn this off before loading real records.
      - key: ELEVENLABS_DEMO_SUMMARY_ENABLED
        value: "true"
