<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Relay</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center;
        justify-content: center; background: #f4f1ea; color: #142b28;
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        padding: env(safe-area-inset-top) 28px env(safe-area-inset-bottom);
      }
      main { max-width: 22rem; text-align: center; }
      h1 { font-size: 1.35rem; margin: 0 0 0.5rem; }
      p { margin: 0 0 1rem; color: #4a5a55; }
      code { background: #e7e2d6; padding: 2px 6px; border-radius: 4px; font-size: 0.85em; }
    </style>
  </head>
  <body>
    <main>
      <h1>Relay can’t reach your care record</h1>
      <p>
        This app reads the recovery record from the Relay server. Start it, then
        reopen the app.
      </p>
      <p><code>npm start</code> in the project root, then relaunch.</p>
      <p>
        If you are very unwell, follow the emergency instructions in your
        discharge papers. Do not wait for this app.
      </p>
    </main>
  </body>
</html>
